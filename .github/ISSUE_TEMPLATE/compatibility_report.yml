name: Compatibility report
description: Report how a feature behaves against a real Protect controller.
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Parity claims need native evidence: what Protect itself saved or showed, not a callback HTTP 200, a counter or a capability flag. **Describe results in words and counts; never attach frames, captions, transcripts or identifiers.**
  - type: input
    id: protect
    attributes:
      label: Protect version
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Emulator commit or image tag
    validations:
      required: true
  - type: input
    id: feature
    attributes:
      label: Feature
      placeholder: e.g. Find Anything search, AI Port person detection, transcripts
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence level
      options:
        - "native-verified: read back from Protect (exact-event GET, native search, UI after reload)"
        - "fixture-tested only"
        - "callback or counter only (not native evidence)"
    validations:
      required: true
  - type: textarea
    id: readback
    attributes:
      label: How you read the result back
      description: The route or screen, and what it showed, as states and counts only.
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: What is still missing (needs_evidence)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no credentials, media, transcripts, identities or private network details.
          required: true

name: Feature proposal
description: Propose new behaviour or a new provider role.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do, and why it is not possible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence it matches Protect or the vendor device
      description: Public documentation or native observations (states and counts only). Say "none yet" if there is none.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This proposal contains no credentials, media, transcripts, identities or private network details.
          required: true

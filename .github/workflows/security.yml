name: Security and quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg14-bookworm@sha256:fb27b00a92028f4749bf18f3d31b18fc62510258326486fb8900653ab2701252
        env:
          # Empty disposable CI database only; never use this auth policy in production.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aikey_rebuild_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d aikey_rebuild_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.lock '.[dev]'
      - name: Enable real media tests with a pinned portable decoder
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps imageio-ffmpeg==0.7.0
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import imageio_ffmpeg
          decoder = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([decoder, "-version"], check=True)
          tools = Path(os.environ["RUNNER_TEMP"]) / "media-test-tools"
          tools.mkdir()
          (tools / "ffmpeg").symlink_to(decoder)
          with open(os.environ["GITHUB_PATH"], "a") as path_file:
              path_file.write(str(tools) + "\n")
          PY
      - name: Run tests
        env:
          AIKEY_TEST_PG_DSN: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/aikey_rebuild_test
        run: python -m pytest -q
      - name: Run static checks
        run: python -m ruff check .
      - name: Audit public source and release record
        run: python tools/community_release_check.py --audit-only
      - name: Build package
        run: python -m build
      - name: Audit package contents without approving release
        run: python tools/community_release_check.py --audit-only --dist dist

  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install optional browser automation, not a production dependency
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.lock '.[browser]'
      - name: Exercise fictional loopback forms with installed sandboxed Chrome
        run: |
          browser="$(command -v google-chrome)"
          "${browser}" --version
          python tools/maintenance_browser_check.py --browser-executable "${browser}" --output browser-results
          python tools/runtime_status_browser_check.py --browser-executable "${browser}" --output runtime-browser-results
          python tools/native_status_browser_check.py --browser-executable "${browser}" --output native-status-browser-results
      - name: Retain only fictional screenshots and source-bound results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fictional-maintenance-browser
          path: |
            browser-results/*.png
            browser-results/result.json
            runtime-browser-results/*.png
            runtime-browser-results/result.json
            native-status-browser-results/*.png
            native-status-browser-results/result.json
          if-no-files-found: error
          retention-days: 14

  dependency-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned security tools
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1 cyclonedx-bom==7.4.0
      - name: Create isolated runtime environment
        run: |
          python -m venv .runtime-sbom
          .runtime-sbom/bin/python -m pip install --disable-pip-version-check -r requirements-runtime.lock
      - name: Generate and validate CycloneDX SBOM
        run: >-
          python -m cyclonedx_py environment .runtime-sbom
          --pyproject pyproject.toml --output-reproducible --of JSON -o sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Audit locked runtime dependencies
        run: python -m pip_audit -r requirements-runtime.lock --strict

  reproducible-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check build==1.6.1 setuptools==84.0.0
      - name: Build twice from isolated clean copies and compare
        # Credentials-free: nothing is signed, tagged, uploaded or published.
        run: |
          epoch="$(git log -1 --format=%ct)"
          for n in 1 2; do
            dir="${RUNNER_TEMP}/release-build-${n}"
            git clone --quiet --no-local "${GITHUB_WORKSPACE}" "${dir}"
            (cd "${dir}" && SOURCE_DATE_EPOCH="${epoch}" PYTHONHASHSEED=0 \
              python -m build --no-isolation --outdir dist)
            python tools/release_check.py verify "${dir}/dist" --epoch "${epoch}" \
              --forbid "${HOME}" --forbid "${dir}" --forbid "${GITHUB_WORKSPACE}" \
              --manifest-out "${RUNNER_TEMP}/release-manifest-${n}.json"
          done
          python tools/release_check.py compare \
            "${RUNNER_TEMP}/release-manifest-1.json" "${RUNNER_TEMP}/release-manifest-2.json"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --output "${RUNNER_TEMP}/${archive}" "${url}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan complete history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 .

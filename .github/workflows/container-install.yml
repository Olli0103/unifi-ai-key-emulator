name: Container clean installation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-install:
    name: container-install (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      INSTALL_ARCH: ${{ matrix.arch }}
      SOURCE_REVISION: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      INSTALL_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Check out public source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select Python for the stdlib-only coordinator
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify native host, exact source and image inputs
        shell: bash
        run: bash tools/container_install_run.sh context
      - name: Install the checksum-pinned native image catalogue tool
        shell: bash
        run: bash tools/container_install_run.sh scanner
      - name: Build both exact-commit images and exercise new-process installed state
        shell: bash
        run: bash tools/container_install_run.sh build
      - name: Remove only this attempt's fixtures and verify terminal receipts
        if: always()
        shell: bash
        run: bash tools/container_install_run.sh cleanup
      - name: Retain only sanitized complete metadata, never fixture state or images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-install-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/container-results/summary.json
            ${{ runner.temp }}/container-results/image-inventory.json
            ${{ runner.temp }}/container-results/aikey-sbom.cdx.json
            ${{ runner.temp }}/container-results/aiport-sbom.cdx.json
            ${{ runner.temp }}/container-results/aikey-licenses.json
            ${{ runner.temp }}/container-results/aiport-licenses.json
          if-no-files-found: error
          retention-days: 14

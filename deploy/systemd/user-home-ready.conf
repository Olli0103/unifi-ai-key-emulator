# Optional drop-in for user@<uid>.service on a host whose separately mounted
# /home appears after the lingering user manager. Not an application timer.
# Install as a new named drop-in; retain all existing vendor/operator entries.
[Service]
TimeoutStartSec=330s
ExecStartPre=/usr/bin/timeout --signal=TERM --kill-after=5s 300s /bin/sh -ec 'until /usr/bin/mountpoint -q /home; do /usr/bin/sleep 1; done'

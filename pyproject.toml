[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "local-aikey"
version = "0.1.0"
description = "Independent experimental UniFi Protect AI processor for a local lab"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.3", "cryptography==50.0.1", "pillow>=11,<13"]

[project.urls]
Repository = "https://github.com/Olli0103/unifi-ai-key-emulator"
Issues = "https://github.com/Olli0103/unifi-ai-key-emulator/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8", "build==1.6.1",
       "numpy>=2,<3", "pillow>=11,<13"]
models = ["sentence-transformers>=5,<6"]
detector = ["rfdetr==1.9.1"]
detector-onnx-cpu = ["rfdetr==1.9.1", "onnxruntime==1.28.0"]
detector-onnx-openvino = ["rfdetr==1.9.1", "onnxruntime-openvino==1.24.1"]
database = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
local-aikey = "aikey.cli:main"
local-aiport-plan = "aikey.aiport_deployment:main"
local-aiport-event-watch = "aikey.aiport_event_watch:main"
local-aiport-provision = "aikey.aiport_instance_state:main"
local-aiport-candidate = "aikey.aiport_candidate:main"
local-aiport-relay = "aikey.aiport_relay:main"
local-aiport-host-relay = "aikey.aiport_host_relay:main"
local-aiport-nas-compose = "aikey.aiport_nas_compose:main"
local-aiport-nas-reconcile = "aikey.aiport_nas_reconcile:main"
local-aiport-onnx-export = "aikey.aiport_onnx_export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

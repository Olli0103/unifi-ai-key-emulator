[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "local-aikey"
version = "0.1.0"
description = "Independent experimental UniFi Protect AI processor for a local lab"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.3", "cryptography==50.0.1"]

[project.urls]
Repository = "https://github.com/Olli0103/unifi-ai-key-emulator"
Issues = "https://github.com/Olli0103/unifi-ai-key-emulator/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8", "build==1.6.1"]
models = ["sentence-transformers>=5,<6"]
database = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
local-aikey = "aikey.cli:main"
local-aiport-plan = "aikey.aiport_deployment:main"
local-aiport-candidate = "aikey.aiport_candidate:main"
local-aiport-relay = "aikey.aiport_relay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
